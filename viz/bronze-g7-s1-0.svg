<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-bronze-title fr-bronze-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719;font-size:22px;text-anchor:middle}.v2{fill:#111719;font-size:19px}.v3{fill:#111719}.v4{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v5{fill:#1f3bff;font-size:17px}.v6{fill:#111719;font-size:22px}.v7{fill:none;stroke:#111719;stroke-width:2px}.v8{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v9{fill:none;stroke:#1f3bff;stroke-width:2px;stroke-dasharray:7px, 7px}.va{fill:#1f3bff;font-size:19px}.vb{fill:#111719;font-size:20px}</style><title id="fr-bronze-title">交汇改变故事，但两条身份线仍然可读。</title><desc id="fr-bronze-desc">第1至5集铺陈、第6集断裂、第7至10集整合；星辰线与阿鸮线并列，节点表示剧情单元，纵向位置不是情绪强度。第9集三方融合，第10集归位与告别。 5 + 1 + 4 是剧情结构，不是观众情绪、效果测量或历史事实。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><text x="235" y="35" font-size="22" fill="#111719" text-anchor="middle" class="v1">EP.01—05 / 铺陈</text><text x="515" y="35" font-size="22" fill="#111719" text-anchor="middle" class="v1">EP.06 / 断裂</text><text x="795" y="35" font-size="22" fill="#111719" text-anchor="middle" class="v1">EP.07—10 / 整合</text><text x="25" y="115" font-size="19" fill="#111719" text-anchor="start" class="v2">星辰 / 明线</text><g data-fr-focus="0" class="v3"><rect x="160" y="65" width="240" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="175" y="94" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">01</text><text x="175" y="130" font-size="22" fill="#111719" text-anchor="start" class="v6">追查父母</text></g><path d="M400 113h40" fill="none" stroke="#111719" stroke-width="2" class="v7"></path><g data-fr-focus="1" class="v3"><rect x="440" y="65" width="240" height="95" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v8"></rect><text x="455" y="94" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">02</text><text x="455" y="130" font-size="22" fill="#111719" text-anchor="start" class="v6">追寻抵达冲突</text></g><path d="M680 113h40" fill="none" stroke="#111719" stroke-width="2" class="v7"></path><g data-fr-focus="2" class="v3"><rect x="720" y="65" width="240" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="735" y="94" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">03</text><text x="735" y="130" font-size="22" fill="#111719" text-anchor="start" class="v6">身份理解与和解</text></g><text x="25" y="295" font-size="19" fill="#111719" text-anchor="start" class="v2">阿鸮 / 暗线</text><g data-fr-focus="0" class="v3"><rect x="160" y="245" width="240" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="175" y="274" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">01</text><text x="175" y="310" font-size="22" fill="#111719" text-anchor="start" class="v6">记忆碎片累积</text></g><path d="M400 293h40" fill="none" stroke="#111719" stroke-width="2" class="v7"></path><g data-fr-focus="1" class="v3"><rect x="440" y="245" width="240" height="95" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v8"></rect><text x="455" y="274" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">02</text><text x="455" y="310" font-size="22" fill="#111719" text-anchor="start" class="v6">阿鸮陨落</text></g><path d="M680 293h40" fill="none" stroke="#111719" stroke-width="2" class="v7"></path><g data-fr-focus="2" class="v3"><rect x="720" y="245" width="240" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="735" y="274" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">03</text><text x="735" y="310" font-size="22" fill="#111719" text-anchor="start" class="v6">妇好显露与归位</text></g><path d="M840 160V245" fill="none" stroke="#1f3bff" stroke-width="2" stroke-dasharray="7 7" class="v9"></path><text x="530" y="217" font-size="19" fill="#1f3bff" text-anchor="start" class="va">身份线在终局交汇 / 第9集融合，第10集归位</text><text x="160" y="391" font-size="20" fill="#111719" text-anchor="start" class="vb">并列 = 两条叙事视角；纵向位置不是情绪强度</text></svg>