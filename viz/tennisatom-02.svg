<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-tennisatom-title fr-tennisatom-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719}.v2{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v3{fill:#1f3bff;font-size:17px}.v4{fill:#111719;font-size:22px}.v5{fill:none;stroke:#111719;stroke-width:2px}.v6{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v7{fill:#1f3bff}.v8{fill:#111719;font-size:27px;text-anchor:middle}.v9{fill:#111719;font-size:19px;text-anchor:middle}</style><title id="fr-tennisatom-title">三路依据汇合，但没有丢掉各自的来源。</title><desc id="fr-tennisatom-desc">骨骼、球路、音频经事件交叉匹配和时间索引进入MatchBundle，交给特效、个性化内容与后期合成；这是原技术方案重绘，不是算法性能测试。 透卡与分镜属于设计表达；五支真人与数据影片分别审看，不伪装为同帧同步。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><g data-fr-focus="0" class="v1"><rect x="25" y="35" width="235" height="90" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v2"></rect><text x="40" y="64" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">SOURCE 01</text><text x="40" y="100" font-size="22" fill="#111719" text-anchor="start" class="v4">骨骼 / 33点</text></g><path d="M260 80H315V195H385" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="1" class="v1"><rect x="25" y="150" width="235" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v6"></rect><text x="40" y="179" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">SOURCE 02</text><text x="40" y="215" font-size="22" fill="#111719" text-anchor="start" class="v4">球路 / TrackNetV2</text></g><path d="M260 195H315V195H385" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="2" class="v1"><rect x="25" y="265" width="235" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v6"></rect><text x="40" y="294" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">SOURCE 03</text><text x="40" y="330" font-size="22" fill="#111719" text-anchor="start" class="v4">音频 / 峰值</text></g><path d="M260 310H315V195H385" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><image href="assets/composition/tennis-skeleton.webp" x="360" y="22" width="280" height="275" preserveAspectRatio="xMidYMid meet" class="v1"></image><rect x="365" y="300" width="280" height="75" fill="#1f3bff" class="v7"></rect><text x="505" y="347" font-size="27" fill="#111719" text-anchor="middle" class="v8">MatchBundle</text><path d="M640 195H695V80H735" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="0" class="v1"><rect x="735" y="35" width="235" height="90" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v2"></rect><text x="750" y="64" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">OUTPUT 01</text><text x="750" y="100" font-size="22" fill="#111719" text-anchor="start" class="v4">特效包络</text></g><path d="M640 195H695V195H735" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="1" class="v1"><rect x="735" y="150" width="235" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v6"></rect><text x="750" y="179" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">OUTPUT 02</text><text x="750" y="215" font-size="22" fill="#111719" text-anchor="start" class="v4">个性化内容</text></g><path d="M640 195H695V310H735" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="2" class="v1"><rect x="735" y="265" width="235" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v6"></rect><text x="750" y="294" font-size="17" fill="#1f3bff" text-anchor="start" class="v3">OUTPUT 03</text><text x="750" y="330" font-size="22" fill="#111719" text-anchor="start" class="v4">多轨合成</text></g><text x="500" y="404" font-size="19" fill="#111719" text-anchor="middle" class="v9">共享时间索引 / 原骨骼透卡，不作为测量样本</text></svg>