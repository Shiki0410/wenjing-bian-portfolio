<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-growth-compass-title fr-growth-compass-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719;font-size:20px}.v2{fill:#111719}.v3{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v4{fill:#1f3bff;font-size:17px}.v5{fill:#111719;font-size:22px}.v6{fill:none;stroke:#111719;stroke-width:2px}.v7{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v8{fill:#111719;font-size:17px}.v9{fill:#111719;font-size:21px}</style><title id="fr-growth-compass-title">研究问题不直接跳到功能，先经过服务触点。</title><desc id="fr-growth-compass-desc">课程期待、思路卡住和求助成本三类问题分别关联课程体验、逻辑画布和朋辈问诊；教师、学生与平台承担不同职责。连线是原方案的设计回应，不是因果估计。 29 份问卷、4 份访谈材料；研究综合画像与服务概念不是上线效果。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><text x="30" y="35" font-size="20" fill="#111719" text-anchor="start" class="v1">RESEARCH / 29份问卷 + 4份访谈材料</text><g data-fr-focus="0" class="v2"><rect x="30" y="65" width="245" height="80" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="45" y="94" font-size="17" fill="#1f3bff" text-anchor="start" class="v4">FRICTION 01</text><text x="45" y="130" font-size="22" fill="#111719" text-anchor="start" class="v5">期待错位</text></g><path d="M275 105H445" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="0" class="v2"><rect x="445" y="65" width="300" height="80" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="460" y="94" font-size="17" fill="#1f3bff" text-anchor="start" class="v4">TOUCHPOINT 01</text><text x="460" y="130" font-size="22" fill="#111719" text-anchor="start" class="v5">课程体验</text></g><g data-fr-focus="1" class="v2"><rect x="30" y="165" width="245" height="80" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="45" y="194" font-size="17" fill="#1f3bff" text-anchor="start" class="v4">FRICTION 02</text><text x="45" y="230" 