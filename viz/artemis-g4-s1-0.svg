<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-artemis-title fr-artemis-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719;font-size:20px}.v2{fill:#111719}.v3{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v4{fill:#3b6149;font-size:17px}.v5{fill:#111719;font-size:22px}.v6{fill:none;stroke:#111719;stroke-width:2px}.v7{fill:#e4e8e0;stroke:#3b6149;stroke-width:3px}.v8{fill:none;stroke:#111719;stroke-width:2px;stroke-dasharray:7px, 7px}.v9{fill:#111719;font-size:21px}</style><title id="fr-artemis-title">输入给出目标，规则决定动作何时继续。</title><desc id="fr-artemis-desc">Idle、Start、Move、Stop状态依次接续。输入检查六边形邻接，SetHexPath接收目标；逻辑完成与动画完成分别处理。支线显示攻击预警与判定，不表示未提供的毫秒时长。 游戏机制图依据原脚本与演示；概念 CG、界面提案和实机分开标记。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><text x="30" y="35" font-size="20" fill="#111719" text-anchor="start" class="v1">MOVEMENT / 非测量时间轴</text><g data-fr-focus="0" class="v2"><rect x="30" y="60" width="210" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="45" y="89" font-size="17" fill="#3b6149" text-anchor="start" class="v4">STATE 01</text><text x="45" y="125" font-size="22" fill="#111719" text-anchor="start" class="v5">Idle</text></g><path d="M240 107h28" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="1" class="v2"><rect x="268" y="60" width="210" height="95" fill="#e4e8e0" stroke="#3b6149" stroke-width="3" class="v7"></rect><text x="283" y="89" font-size="17" fill="#3b6149" text-anchor="start" class="v4">STATE 02</text><text x="283" y="125" font-size="22" fill="#111719" text-anchor="start" class="v5">Start</text></g><path d="M478 107h28" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="506" y="60" width="210" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="521" y="89" font-size="17" fill="#3b6149" text-anchor="start" class="v4">STATE 03</text><text x="521" y="125" font-size="22" fill="#111719" text-anchor="start" class="v5">Move</text></g><path d="M716 107h28" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="744" y="60" width="210" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="759" y="89" font-size="17" fill="#3b6149" text-anchor="start" class="v4">STATE 04</text><text x="759" y="125" font-size="22" fill="#111719" text-anchor="start" class="v5">Stop</text></g><path d="M850 155V185H135V155" fill="none" stroke="#111719" stroke-width="2" stroke-dasharray="7 7" class="v8"></path><text x="420" y="211" font-size="21" fill="#111719" text-anchor="start" class="v9">完成条件与动画回调分别检查</text><image href="assets/folio-repair/artemis-elite2-design.webp" x="20" y="235" width="215" height="165" preserveAspectRatio="xMidYMid meet" class="v2"></image><g data-fr-focus="0" class="v2"><rect x="275" y="255" width="210" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="290" y="284" font-size="17" fill="#3b6149" text-anchor="start" class="v4">COMBAT 01</text><text x="290" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">预警</text></g><path d="M485 302h28" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="1" class="v2"><rect x="513" y="255" width="210" height="95" fill="#e4e8e0" stroke="#3b6149" stroke-width="3" class="v7"></rect><text x="528" y="284" font-size="17" fill="#3b6149" text-anchor="start" class="v4">COMBAT 02</text><text x="528" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">判定</text></g><path d="M723 302h28" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="751" y="255" width="210" height="95" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="766" y="284" font-size="17" fill="#3b6149" text-anchor="start" class="v4">COMBAT 03</text><text x="766" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">阶段变化</text></g><text x="275" y="390" font-size="20" fill="#111719" text-anchor="start" class="v1">邻接检查 → SetHexPath / 距离与冷却 → 敌人行为</text></svg>