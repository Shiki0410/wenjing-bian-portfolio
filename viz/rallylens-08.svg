<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="逐事件编码的检查链"><style>.v0{fill:none;stroke:#1f3bff;stroke-width:1.5px;stroke-dasharray:3px, 4px}.v1{fill:none;stroke:#1f3bff}.v2{fill:#1f3bff}.v3{fill:#111719}.v4{fill:#111719;font-size:11px}.v5{stroke:#111719}</style><title>逐事件编码的检查链</title><desc>球路是示意线，不是跟踪坐标。画面确认击球方向、过网与接触，未知保留为未知。</desc><metadata>RallyLens / original cobalt palette / source or schematic as described</metadata><image href="assets/rally-flat-pair-v1.webp" x="5" y="40" width="325" height="108"></image><path d="M77 103Q168 5 266 103" fill="none" stroke="#1f3bff" stroke-width="1.5" stroke-dasharray="3 4" class="v0"></path><path d="M168 62v85M20 148h300" stroke="#1f3bff" fill="none" class="v1"></path><g fill="#1f3bff" class="v2"><circle cx="85" cy="98" r="3" class="v2"></circle><circle cx="259" cy="91" r="3" class="v2"></circle></g><g font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#111719" class="v3"><text x="22" y="174" class="v4">谁 → 谁</text><text x="118" y="174" class="v4">越过球网</text><text x="231" y="174" class="v4">回应接触</text><text x="22" y="195" class="v4">方向或未知</text><text x="118" y="195" class="v4">进入条件</text><text x="231" y="195" class="v4">下一次机会</text><text x="22" y="228" class="v4">没有回应 ≠ 回应未确认</text></g><path d="M89 179h17M198 179h18" stroke="#111719" class="v5"></path></svg>