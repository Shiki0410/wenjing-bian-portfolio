<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-baseball-title fr-baseball-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719;font-size:22px}.v2{fill:#111719}.v3{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v4{fill:#0d1020;font-size:17px}.v5{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v6{fill:#f6f7fa;stroke:#1f3bff;stroke-width:2px}.v7{fill:#111719;font-size:24px}.v8{fill:none;stroke:#111719;stroke-width:2px}.v9{fill:#111719;font-size:20px}</style><title id="fr-baseball-title">阅读尺度变了，统计单位不能偷偷改变。</title><desc id="fr-baseball-desc">原四份CSV进入聚合、筛选和编码。人物概览、图表实验室、空间细节分别显示自己的统计单位；结构箭头不编码性能提升。 四份 CSV 的单位不同；2026 只覆盖源文件时段，不作完整赛季结论。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><text x="30" y="33" font-size="22" fill="#111719" text-anchor="start" class="v1">四份 CSV / 单位分别保留</text><g data-fr-focus="0" class="v2"><rect x="30" y="60" width="240" height="80" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="45" y="89" font-size="17" fill="#0d1020" text-anchor="start" class="v4">SOURCE / 1</text><text x="45" y="125" font-size="22" fill="#111719" text-anchor="start" class="v1">投手 / 逐球</text></g><g data-fr-focus="1" class="v2"><rect x="30" y="160" width="240" height="80" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v5"></rect><text x="45" y="189" font-size="17" fill="#0d1020" text-anchor="start" class="v4">SOURCE / 2</text><text x="45" y="225" font-size="22" fill="#111719" text-anchor="start" class="v1">打者 / 击球</text></g><g data-fr-focus="2" class="v2"><rect x="30" y="260" width="240" height="80" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="45" y="289" font-size="17" fill="#0d1020" text-anchor="start" class="v4">SOURCE / 3</text><text x="45" y="325" font-size="22" fill="#111719" text-anchor="start" class="v1">球队 / 汇总</text></g><rect x="330" y="45" width="620" height="315" fill="#f6f7fa" stroke="#1f3bff" stroke-width="2" data-fr-focus="0" class="v6"></rect><text x="350" y="80" font-size="24" fill="#111719" text-anchor="start" class="v7">宏观 / 认识对象</text><rect x="360" y="130" width="560" height="225" fill="#f6f7fa" stroke="#1f3bff" stroke-width="2" data-fr-focus="1" class="v6"></rect><text x="380" y="165" font-size="24" fill="#111719" text-anchor="start" class="v7">实验室 / 比较分布</text><rect x="390" y="215" width="500" height="135" fill="#f6f7fa" stroke="#1f3bff" stroke-width="2" data-fr-focus="2" class="v6"></rect><text x="410" y="250" font-size="24" fill="#111719" text-anchor="start" class="v7">细节 / 检查位置</text><path d="M270 190H330" fill="none" stroke="#111719" stroke-width="2" class="v8"></path><text x="30" y="392" font-size="20" fill="#111719" text-anchor="start" class="v9">逐球 / 击球 / 球队汇总 ≠ 同一个分母</text><text x="520" y="392" font-size="20" fill="#111719" text-anchor="start" class="v9">图形位置与数值相邻</text></svg>