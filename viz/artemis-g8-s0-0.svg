<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" role="img" aria-labelledby="state-title state-desc"><style>.v0{fill:none;stroke:#70677b;stroke-width:1.5px}.v1{fill:#f6f7fa}.v2{fill:#335644;stroke:#335644;stroke-width:2px}.v3{fill:#ffffff;font-size:13px;text-anchor:middle;letter-spacing:0.78px}.v4{fill:#ffffff;font-size:24px;font-weight:600;text-anchor:middle}.v5{fill:#f6f7fa;stroke:#70677b;stroke-width:1.5px}.v6{fill:#5b5363;font-size:13px;text-anchor:middle;letter-spacing:0.78px}.v7{fill:#302a37;font-size:24px;font-weight:600;text-anchor:middle}.v8{fill:#4c4457}.v9{fill:#4c4457;font-size:17px;text-anchor:middle}.va{fill:#5e5765;font-size:13px}</style><title id="state-title">Hex 地图中的玩家移动主链</title><desc id="state-desc">四个节点依次为待机、起步、持续移动、停步。有效路径启动起步，起步动画结束进入持续移动；到达最后一个目标且队列为空时停步，停步动画结束返回待机。箭头为代码中的主要切换，不表示耗时；未画出跳跃、攀爬和中断分支。当前查看待机。</desc><metadata>{"source":"Artemis PLAYER LOCOMOTION / SOURCE SCRIPTS","evidence":"source-code","scope":"primary Hex locomotion transitions","geometry":"non-quantitative"}</metadata><defs><marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#70677b" stroke-width="1.5" class="v0"></path></marker></defs><g id="background" aria-hidden="true"><rect width="900" height="268" fill="#f6f7fa" class="v1"></rect></g><g id="axes" aria-label="状态切换条件" fill="none" stroke="#70677b" stroke-width="1.5" marker-end="url(#state-arrow)" class="v0"><path d="M175 112H246" class="v0"></path><path d="M390 112H461" class="v0"></path><path d="M605 112H676" class="v0"></path><path d="M748 154V216H102V155" class="v0"></path></g><g id="data" aria-label="玩家移动状态" data-unit-of-analysis="declared locomotion state"><g data-record-id="PlayerIdleState" data-evidence-type="fact"><rect x="30" y="77" width="145" height="76" fill="#746098" stroke="#746098" stroke-width="2" class="v2"></rect><text x="102.5" y="105" text-anchor="middle" fill="#ffffff" class="v3">IDLE</text><text x="102.5" y="133" text-anchor="middle" fill="#ffffff" class="v4">待机</text></g><g data-record-id="PlayerMoveStartState" data-evidence-type="fact"><rect x="245" y="77" width="145" height="76" fill="#f6f7fa" stroke="#70677b" stroke-width="1.5" class="v5"></rect><text x="317.5" y="105" text-anchor="middle" fill="#5b5363" class="v6">MOVE START</text><text x="317.5" y="133" text-anchor="middle" fill="#302a37" class="v7">起步</text></g><g data-record-id="PlayerMoveLoopState" data-evidence-type="fact"><rect x="460" y="77" width="145" height="76" fill="#f6f7fa" stroke="#70677b" stroke-width="1.5" class="v5"></rect><text x="532.5" y="105" text-anchor="middle" fill="#5b5363" class="v6">MOVE LOOP</text><text x="532.5" y="133" text-anchor="middle" fill="#302a37" class="v7">持续移动</text></g><g data-record-id="PlayerMoveEndState" data-evidence-type="fact"><rect x="675" y="77" width="145" height="76" fill="#f6f7fa" stroke="#70677b" stroke-width="1.5" class="v5"></rect><text x="747.5" y="105" text-anchor="middle" fill="#5b5363" class="v6">MOVE END</text><text x="747.5" y="133" text-anchor="middle" fill="#302a37" class="v7">停步</text></g></g><g id="annotations" fill="#4c4457" text-anchor="middle" class="v8"><text x="211" y="37" class="v9">有效路径</text><text x="211" y="60" class="v9">SetHexPath</text><text x="426" y="37" class="v9">起步动画结束</text><text x="426" y="60" class="v9">OnEnd</text><text x="641" y="37" class="v9">到达最后目标</text><text x="641" y="60" class="v9">队列为空</text><rect x="327" y="197" width="195" height="38" fill="#f6f7fa" class="v1"></rect><text x="425" y="222" class="v9">停步动画结束 · OnEnd</text></g><g id="source-notes" aria-label="阅读边界"><text x="30" y="258" fill="#5e5765" class="va">主要切换 / 路径与动画事件共同控制；其他移动分支另行组织。</text></g></svg>