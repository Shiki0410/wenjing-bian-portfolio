<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-garden-title fr-garden-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719}.v2{fill:#111719;font-size:24px}.v3{fill:none;stroke:#111719;stroke-width:2px}.v4{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v5{fill:#1f3bff;font-size:17px}.v6{fill:#111719;font-size:22px}.v7{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v8{fill:#111719;font-size:21px}</style><title id="fr-garden-title">一条故事路径，两种观看目的，三层交互职责。</title><desc id="fr-garden-desc">故事依原次序秋冬春夏展开；剧情与游览模式分别进入解谜和文化阅读。输入、NPC与摄像机职责在微信小程序适配中分开；不表示所有美术由个人完成。 团队美术与个人模块职责分别说明；改字示例不与另一组截图逐字冒认。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><image href="assets/garden-autumn.webp" x="25" y="50" width="220" height="140" preserveAspectRatio="xMidYMid meet" class="v1"></image><text x="25" y="32" font-size="24" fill="#111719" text-anchor="start" class="v2">01 / 秋</text><path d="M245 123h20" fill="none" stroke="#111719" stroke-width="2" class="v3"></path><image href="assets/garden-winter.webp" x="265" y="50" width="220" height="140" preserveAspectRatio="xMidYMid meet" class="v1"></image><text x="265" y="32" font-size="24" fill="#111719" text-anchor="start" class="v2">02 / 冬</text><path d="M485 123h20" fill="none" stroke="#111719" stroke-width="2" class="v3"></path><image href="assets/garden-spring.webp" x="505" y="50" width="220" height="140" preserveAspectRatio="xMidYMid meet" class="v1"></image><text x="505" y="32" font-size="24" fill="#111719" text-anchor="start" class="v2">03 / 春</text><path d="M725 123h20" fill="none" stroke="#111719" stroke-width="2" class="v3"></path><image href="assets/garden-summer.webp" x="745" y="50" width="220" height="140" preserveAspectRatio="xMidYMid meet" class="v1"></image><text x="745" y="32" font-size="24" fill="#111719" text-anchor="start" class="v2">04 / 夏</text><path d="M25 221H975" fill="none" stroke="#111719" stroke-width="2" class="v3"></path><g data-fr-focus="0" class="v1"><rect x="70" y="260" width="250" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="85" y="289" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">MY MODULE / 01</text><text x="85" y="325" font-size="22" fill="#111719" text-anchor="start" class="v6">输入适配</text></g><g data-fr-focus="1" class="v1"><rect x="375" y="260" width="250" height="90" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v7"></rect><text x="390" y="289" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">MY MODULE / 02</text><text x="390" y="325" font-size="22" fill="#111719" text-anchor="start" class="v6">NPC交互</text></g><g data-fr-focus="2" class="v1"><rect x="680" y="260" width="250" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v4"></rect><text x="695" y="289" font-size="17" fill="#1f3bff" text-anchor="start" class="v5">MY MODULE / 03</text><text x="695" y="325" font-size="22" fill="#111719" text-anchor="start" class="v6">摄像机视角</text></g><text x="25" y="397" font-size="21" fill="#111719" text-anchor="start" class="v8">故事顺序 / 秋冬春夏     ·     剧情解谜 ≠ 自由游览</text></svg>