<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-afterglow-title fr-afterglow-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719}.v2{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v3{fill:#1d35e1;font-size:17px}.v4{fill:#111719;font-size:22px}.v5{fill:none;stroke:#111719;stroke-width:2px}.v6{fill:#e4e8e0;stroke:#1f3bff;stroke-width:3px}.v7{fill:#111719;font-size:20px;text-anchor:middle}</style><title id="fr-afterglow-title">同一骨架，四种变化各有职责。</title><desc id="fr-afterglow-desc">人流改变环幅与密度，噪声改变波瓣与扭曲，PM2.5改变字号与外圈膨胀，风改变行进与倾斜。字重由独立手动开关控制，中心盘不是数据总分。 原代码内置样本用于演示，不写作实时车站实测；空间图是渲染提案。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><image href="assets/afterglow-glyph.webp" x="330" y="60" width="340" height="290" preserveAspectRatio="xMidYMid meet" class="v1"></image><g data-fr-focus="0" class="v1"><rect x="20" y="35" width="315" height="85" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v2"></rect><text x="35" y="64" font-size="17" fill="#1d35e1" text-anchor="start" class="v3">CHANNEL 01</text><text x="35" y="100" font-size="22" fill="#111719" text-anchor="start" class="v4">人流 / 环幅·密度</text></g><path d="M335 77L370 135" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="1" class="v1"><rect x="665" y="35" width="315" height="85" fill="#e4e8e0" stroke="#1f3bff" stroke-width="3" class="v6"></rect><text x="680" y="64" font-size="17" fill="#1d35e1" text-anchor="start" class="v3">CHANNEL 02</text><text x="680" y="100" font-size="22" fill="#111719" text-anchor="start" class="v4">噪声 / 波瓣·扭曲</text></g><path d="M665 77L630 135" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="2" class="v1"><rect x="20" y="250" width="315" height="85" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v2"></rect><text x="35" y="279" font-size="17" fill="#1d35e1" text-anchor="start" class="v3">CHANNEL 03</text><text x="35" y="315" font-size="22" fill="#111719" text-anchor="start" class="v4">PM2.5 / 字号·膨胀</text></g><path d="M335 292L370 285" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><g data-fr-focus="2" class="v1"><rect x="665" y="250" width="315" height="85" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v2"></rect><text x="680" y="279" font-size="17" fill="#1d35e1" text-anchor="start" class="v3">CHANNEL 04</text><text x="680" y="315" font-size="22" fill="#111719" text-anchor="start" class="v4">风 / 行进·倾斜</text></g><path d="M665 292L630 285" fill="none" stroke="#111719" stroke-width="2" class="v5"></path><text x="500" y="386" font-size="20" fill="#111719" text-anchor="middle" class="v7">字重 / 手动控制     ·     相邻样本 / 插值</text></svg>