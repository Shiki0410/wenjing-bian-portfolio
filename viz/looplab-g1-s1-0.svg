<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-looplab-title fr-looplab-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><style>.v0{fill:#f6f7fa}.v1{fill:#111719;font-size:20px}.v2{fill:#111719}.v3{fill:#f6f7fa;stroke:#111719;stroke-width:1.5px}.v4{fill:#1e39f5;font-size:17px}.v5{fill:#111719;font-size:22px}.v6{fill:none;stroke:#111719;stroke-width:2px}.v7{fill:none;stroke:#1e39f5;stroke-width:2px;stroke-dasharray:7px, 7px}.v8{fill:#e4e8e0;stroke:#1e39f5;stroke-width:3px}</style><title id="fr-looplab-title">线上确定需求，线下完成交接。</title><desc id="fr-looplab-desc">找到材料、协商预约、确认与通知、校园取件、归档与再用五阶段分别接续屏幕操作与线下服务。项目档案记录项目资料；图的列宽相等，不表示实测耗时。 原需求、流程与商业模式为服务设计方案；项目档案记录照片／3D 扫描，不是库存档案。</desc><rect width="1000" height="420" fill="#f6f7fa" class="v0"></rect><text x="25" y="35" font-size="20" fill="#111719" text-anchor="start" class="v1">ONLINE</text><g data-fr-focus="0" class="v2"><rect x="25" y="55" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="40" y="84" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">01</text><text x="40" y="120" font-size="22" fill="#111719" text-anchor="start" class="v5">发现需求</text></g><path d="M202 100h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><path d="M113 145V255" fill="none" stroke="#1e39f5" stroke-width="2" stroke-dasharray="7 7" class="v7"></path><g data-fr-focus="1" class="v2"><rect x="217" y="55" width="177" height="90" fill="#e4e8e0" stroke="#1e39f5" stroke-width="3" class="v8"></rect><text x="232" y="84" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">02</text><text x="232" y="120" font-size="22" fill="#111719" text-anchor="start" class="v5">协商与预约</text></g><path d="M394 100h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><path d="M305 145V255" fill="none" stroke="#1e39f5" stroke-width="2" stroke-dasharray="7 7" class="v7"></path><g data-fr-focus="2" class="v2"><rect x="409" y="55" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="424" y="84" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">03</text><text x="424" y="120" font-size="22" fill="#111719" text-anchor="start" class="v5">确认与通知</text></g><path d="M586 100h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><path d="M497 145V255" fill="none" stroke="#1e39f5" stroke-width="2" stroke-dasharray="7 7" class="v7"></path><g data-fr-focus="2" class="v2"><rect x="601" y="55" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="616" y="84" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">04</text><text x="616" y="120" font-size="22" fill="#111719" text-anchor="start" class="v5">取件信息</text></g><path d="M778 100h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><path d="M689 145V255" fill="none" stroke="#1e39f5" stroke-width="2" stroke-dasharray="7 7" class="v7"></path><g data-fr-focus="2" class="v2"><rect x="793" y="55" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="808" y="84" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">05</text><text x="808" y="120" font-size="22" fill="#111719" text-anchor="start" class="v5">项目档案</text></g><path d="M881 145V255" fill="none" stroke="#1e39f5" stroke-width="2" stroke-dasharray="7 7" class="v7"></path><text x="25" y="240" font-size="20" fill="#111719" text-anchor="start" class="v1">OFFLINE</text><g data-fr-focus="0" class="v2"><rect x="25" y="255" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="40" y="284" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">01</text><text x="40" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">材料信息</text></g><path d="M202 300h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="1" class="v2"><rect x="217" y="255" width="177" height="90" fill="#e4e8e0" stroke="#1e39f5" stroke-width="3" class="v8"></rect><text x="232" y="284" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">02</text><text x="232" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">制作准备</text></g><path d="M394 300h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="409" y="255" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="424" y="284" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">03</text><text x="424" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">履约安排</text></g><path d="M586 300h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="601" y="255" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="616" y="284" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">04</text><text x="616" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">校园交接</text></g><path d="M778 300h15" fill="none" stroke="#111719" stroke-width="2" class="v6"></path><g data-fr-focus="2" class="v2"><rect x="793" y="255" width="177" height="90" fill="#f6f7fa" stroke="#111719" stroke-width="1.5" class="v3"></rect><text x="808" y="284" font-size="17" fill="#1e39f5" text-anchor="start" class="v4">05</text><text x="808" y="320" font-size="22" fill="#111719" text-anchor="start" class="v5">再用与制作</text></g><text x="25" y="393" font-size="20" fill="#111719" text-anchor="start" class="v1">列宽不表示耗时 / 通知跨模块 / 档案记录项目资料</text></svg>