<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-label="五模型 AUC 与 bootstrap 95% 区间"><style>.v0{fill:#573e49;font-size:12px}.v1{fill:none;stroke:#c3c9c2}.v2{fill:#573e49;font-size:12px;text-anchor:middle}.v3{fill:#795868;font-size:12px}.v4{fill:none;stroke:#795868;stroke-width:2px}.v5{fill:#795868}.v6{fill:#1f3bff;font-size:12px;font-weight:700}.v7{fill:none;stroke:#1f3bff;stroke-width:2px}.v8{fill:#1f3bff}</style><title>五模型 AUC 与 bootstrap 95% 区间</title><desc>区间高度重叠，不从微小AUC差异推断模型优越性。</desc><g aria-hidden="true"><text x="25" y="25" class="v0">AUC / BOOTSTRAP 95% CI</text><text x="25" y="49" class="v0">横轴局部放大 0.93—1.00 / 点为 AUC，线为区间</text><path d="M195 65V300" class="v1"></path><text x="195" y="328" text-anchor="middle" class="v2">0.93</text><path d="M322.14285714285654 65V300" class="v1"></path><text x="322.14285714285654" y="328" text-anchor="middle" class="v2">0.95</text><path d="M449.28571428571377 65V300" class="v1"></path><text x="449.28571428571377" y="328" text-anchor="middle" class="v2">0.97</text><path d="M576.428571428571 65V300" class="v1"></path><text x="576.428571428571" y="328" text-anchor="middle" class="v2">0.99</text><path d="M639.9999999999997 65V300" class="v1"></path><text x="639.9999999999997" y="328" text-anchor="middle" class="v2">1.00</text><g><text x="25" y="91" class="v3">1. NumPy MLP</text><path d="M496.1894385666067 86H588.5054551296498M496.1894385666067 80V92M588.5054551296498 80V92" class="v4"></path><circle cx="549.1196851061118" cy="86" r="5" class="v5"></circle></g><g><text x="25" y="138" class="v6">2. PyTorch MLP</text><path d="M490.6271992501057 133H590.6223595248202M490.6271992501057 127V139M590.6223595248202 127V139" class="v7"></path><circle cx="546.5854091395499" cy="133" r="7" class="v8"></circle></g><g><text x="25" y="185" class="v3">3. Random Forest</text><path d="M542.8877832893339 180H605.704368170963M542.8877832893339 174V186M605.704368170963 174V186" class="v4"></path><circle cx="580.768666362