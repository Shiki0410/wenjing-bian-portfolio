<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="fr-privacy-city-title fr-privacy-city-desc" font-family="Inter Tight, Arial, Microsoft YaHei, sans-serif" fill="#111719"><title id="fr-privacy-city-title">同一个问题，两条不同的验证路径。</title><desc id="fr-privacy-city-desc">上路：网页情境、阅读和选择进入规则反馈。下路：合成样本经48维特征进入离线模型和评估。虚线只表示设计参考，不表示在线推理。 5,000 条合成样本实验；不是在线访客画像，也不是实际设备授权。</desc><rect width="1000" height="420" fill="#f5f6f2"></rect><text x="25" y="75" font-size="20" fill="#111719" text-anchor="start">WEB / 可体验原型</text><g><rect x="260" y="45" width="205" height="95" fill="#e4e8e0" stroke="#d9285d" stroke-width="3"></rect><text x="275" y="74" font-size="17" fill="#d9285d" text-anchor="start">01</text><text x="275" y="110" font-size="22" fill="#111719" text-anchor="start">模拟请求</text></g><path d="M465 92h25" fill="none" stroke="#111719" stroke-width="2"></path><g><rect x="490" y="45" width="205" height="95" fill="#f5f6f2" stroke="#111719" stroke-width="1.5"></rect><text x="505" y="74" font-size="17" fill="#d9285d" text-anchor="start">02</text><text x="505" y="110" font-size="22" fill="#111719" text-anchor="start">阅读与选择</text></g><path d="M695 92h25" fill="none" stroke="#111719" stroke-width="2"></path><g><rect x="720" y="45" width="205" height="95" fill="#f5f6f2" stroke="#111719" stroke-width="1.5"></rect><text x="735" y="74" font-size="17" fill="#d9285d" text-anchor="start">03</text><text x="735" y="110" font-size="22" fill="#111719" text-anchor="start">规则反馈</text></g><text x="25" y="255" font-size="20" fill="#111719" text-anchor="start">OFFLINE / 可复现实验</text><g><rect x="260" y="225" width="205" height="95" fill="#e4e8e0" stroke="#d9285d" stroke-width="3"></rect><text x="275" y="254" font-size="17" fill="#d9285d" text-anchor="start">01</text><text x="275" y="290" font-size="22" fill="#111719" text-anchor="start">合成样本</text></g><path d="M465 272h25" fill="none" stroke="#111719" stroke-width="2"></path><g><rect x="490" y="225" width="205" height="95" fill="#f5f6f2" stroke="#111719" stroke-width="1.5"></rect><text x="505" y="254" font-size="17" fill="#d9285d" text-anchor="start">02</text><text x="505" y="290" font-size="22" fill="#111719" text-anchor="start">48 维特征</text></g><path d="M695 272h25" fill="none" stroke="#111719" stroke-width="2"></path><g><rect x="720" y="225" width="205" height="95" fill="#f5f6f2" stroke="#111719" stroke-width="1.5"></rect><text x="735" y="254" font-size="17" fill="#d9285d" text-anchor="start">03</text><text x="735" y="290" font-size="22" fill="#111719" text-anchor="start">模型与评估</text></g><path d="M360 140V195H820V225" fill="none" stroke="#d9285d" stroke-width="2" stroke-dasharray="7 7"></path><text x="430" y="185" font-size="19" fill="#d9285d" text-anchor="start">仅参考设计 / 非在线推理</text><text x="25" y="396" font-size="20" fill="#111719" text-anchor="start">网页反馈 ≠ 模型概率 / 来源与验证路径分别保留</text></svg>